    clf__lr: 0.001
    clf__D1: 25
    clf__kernel_size: 10
    clf__p_dropout: 0.25
  aeon_multirockethydra:
    clf__n_groups: 8
    clf__n_kernels: 2
  fnirst:
    clf__lr: 0.001
    clf__depth: 2
    clf__dim: 128
    clf__dropout: 0.0
  fnirsnet23:
    clf__lr: 0.01
    clf__F1: 8
    clf__F2: 16
  fnirsnet24:
    clf__lr: 0.01
    clf__p_dropout: 0.5
