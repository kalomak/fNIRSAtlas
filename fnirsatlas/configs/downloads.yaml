# MA suite:

bnci:
  type: automatic
  parts: ["01", "02", "03", "04", "05", "06", "07", "08"]
  url: https://bnci-horizon-2020.eu/database/data-sets/003-2014/S{part}.mat
  destination: datasets/BNCI/data/
  filename: S{part}.mat

shin2019:
  type: automatic
  url: https://ndownloader.figshare.com/files/16753760
  destination: datasets/Shin2019/
  filename: NIRS data_Shin et al. (fninf 2009).zip
  extractions:
    - archive: NIRS data_Shin et al. (fninf 2009).zip
      destination: ./

shin2018b:
  type: automatic
  url: https://ndownloader.figshare.com/files/10515928
  destination: datasets/Shin2018b/
  filename: Shin2018b.zip
  extractions:
    - archive: Shin2018b.zip
      destination: matdata

shin2016:
  type: automatic
  # License: GNU GPL, https://doc.ml.tu-berlin.de/hBCI/
  url: https://doc.ml.tu-berlin.de/hBCI/NIRS/NIRS_01-29.zip
  destination: datasets/Shin2016/
  filename: NIRS_01-29.zip
  extractions:
    - archive: NIRS_01-29.zip
      destination: ./

# Motor suite:

bak2019:
  type: automatic
  url: https://ndownloader.figshare.com/files/18069143
  destination: datasets/Bak2019/
  filename: Bak2019.zip
  extractions:
    - archive: Bak2019.zip
      destination: data

cockx2023:
  type: automatic
  url: https://data.ru.nl/api/collectionfiles/di/id/di_231884707/files/download
  destination: datasets/Cockx2023/
  filename: Cockx2023.tar.gz
  size: 656MB
  extractions:
    - archive: Cockx2023.tar.gz
      destination: ./

ortega2020:
