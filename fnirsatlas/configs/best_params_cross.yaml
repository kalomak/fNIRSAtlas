# Generated by scripts/best_params.py -c cross: parameters with the highest mean kappa over datasets (nested search).
datasets:
- bak2019
- shin2016__ma
- cockx2023
- guevara2024
- shin2016__mi
- shin2018__nback
- nemo__afim
- shin2018__wg
- huang2021
seeds:
- 0
- 1
- 2
- 3
- 4
params:
  lda:
    extractor__features:
    - mean
    - slope
    extractor__n_windows: 5
  ann:
    clf__activation: tanh
    clf__hidden_layer_sizes:
    - 256
    clf__learning_rate_init: 0.001
    extractor__n_windows: 50
  cnn2a:
    clf__lr: 0.001
    clf__kernel_size: 10
    clf__n_filters: 32
    clf__p_dropout: 0.25
  lstm:
    clf__lr: 0.001
    clf__hidden_size: 64
    clf__num_layers: 4
    clf__p_dropout: 0.5
  eegnet:
    clf__lr: 0.001
    clf__F1: 16
    clf__kernel_size_1: 10
    clf__p_dropout: 0.5
  dcn:
    clf__lr: 0.01
    clf__D1: 4
    clf__kernel_size: 10
    clf__p_dropout: 0.5
  aeon_multirockethydra:
    clf__n_groups: 128
    clf__n_kernels: 32
  fnirst:
    clf__lr: 0.001
    clf__depth: 6
    clf__dim: 64
    clf__dropout: 0.0
  fnirsnet23:
    clf__lr: 0.001
    clf__F1: 8
    clf__F2: 32
  fnirsnet24:
    clf__lr: 0.01
    clf__p_dropout: 0.25
    clf__spatial_filters: 4
    clf__temporal_filters: 20
