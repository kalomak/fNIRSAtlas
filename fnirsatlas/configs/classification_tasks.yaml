shin2019:
  classification_tasks:
    ma:
      - description: "BL|MA" # Name for consistency with other MA datasets
        mapping:
          Idle State: 0
          Mental Arithmetic: 1
    mi:
      - description: "MA vs MI vs Rest"
        include: false
        mapping:
          Idle State: 0
          Mental Arithmetic: 1
          Motor Imagery: 2
      - description: "MI|Rest"
        mapping:
          Idle State: 0
          Motor Imagery: 1
      - description: "MA|MI"
        include: false
        mapping:
          Mental Arithmetic: 0
          Motor Imagery: 1

