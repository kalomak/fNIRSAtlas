# Shared paths configuration
paths:
  raw_datasets: "~/mne_data/fnirsatlas/datasets"
  processed_datasets: "~/mne_data/fnirsatlas/processed_datasets"
  results_cache: "~/mne_data/fnirsatlas/results"
  results: "./results"

# Dataset paths configuration
datasets:
  bak2019:
    subpath: "Bak2019/data"
    description: "Bak2019 fNIRS dataset"
    original_data_type: "hbo_hbr" # Already processed to hemoglobin concentration

  shin2016:
    subpath: "Shin2016"
    description: "Shin2016 fNIRS dataset"
    original_data_type: "fnirs_cw_amplitude" # Raw light intensity data

  shin2019:
    subpath: "Shin2019/matdata"
    description: "Shin2019 fNIRS dataset"
    original_data_type: "hbo_hbr" # Already processed to hemoglobin concentration

  shin2018:
    subpath: "Shin2018/data"
    description: "Shin2018 fNIRS dataset"
    original_data_type: "hbo_hbr"

  shin2018b:
    subpath: "Shin2018b/matdata"
    description: "Shin2018b fNIRS dataset"
    original_data_type: "hbo_hbr"

  luke2021:
    subpath: "Luke2021/data"
    description: "Luke2021 fNIRS dataset (BIDS format)"
    original_data_type: "fnirs_cw_amplitude" # Raw light intensity data
    preprocessing:
      remove_short: 0.01

  # This is a duplicate of the Luke2024a dataset
  luke2024a:
    subpath: "Luke2024a/data"
    description: "FRESH audio"
    original_data_type: "fnirs_cw_amplitude"
    tmax: 13
    preprocessing:
      remove_short: 0.02

  luke2024b:
    subpath: "Luke2024b/data"
    description: "FRESH motor"
    original_data_type: "fnirs_cw_amplitude"
    tmax: 10 # Few outliers will be dropped
    preprocessing:
      remove_short: 0.02

  nemo:
    subpath: "NEMO/nemo-bids"
    description: "NEMO fNIRS dataset (BIDS format)"
    original_data_type: "fnirs_od" # Optical density data
    afim:
      tmax: 30

  bnci:
    subpath: "BNCI/data"
    description: "BNCI Horizon 2020 Dataset Mental arithmetic (003-2014)"
    original_data_type: "hbo_hbr" # Hemoglobin concentration data

  cockx2023:
    subpath: "Cockx2023/bids_raw"
    description: "Cockx2023 fNIRS dataset (BIDS format with special channel mapping)"
    original_data_type: "fnirs_od" # Optical density data
    preprocessing:
      remove_short: 0.02 # short channels are slightly longer than 1cm

  shader2021:
    subpath: "Shader2021/2021-fNIRS-Audio-visual-speech-Broad-vs-restricted-regions"
    description: "Shader2021 fNIRS dataset (BIDS format) - Audio/Video/Control experiment"
    original_data_type: "fnirs_cw_amplitude" # Raw light intensity data

  herff2014:
    subpath: "Herff2014"
    description: "Herff2014 fNIRS dataset (n-back experiment, prefrontal cortex)"
    original_data_type: "hbo_hbr"
    tmax: 40

  ortega2020:
    subpath: "Ortega2020"
    description: "Ortega2020 HYGRIP fNIRS dataset (left/right hand grip experiment)"
    original_data_type: "fnirs_cw_amplitude"

  buccino2016:
    subpath: "Buccino2016"
    description: "Buccino2016 EEG-fNIRS hybrid SMR BCI dataset"
    original_data_type: "fnirs_cw_amplitude" # Raw light intensity data
    tmax: 11.8 # Override default tmax to fix overlap issues

  guevara2024:
    subpath: "Guevara2024/data"
    description: "Guevara2024 fNIRS dataset (BIDS format)"
    original_data_type: "fnirs_cw_amplitude" # Raw light intensity data

  yi2025:
    subpath: "Yi2025/FineMI"
    description: "Yi2025 Fine Motor Imagery fNIRS dataset"
    original_data_type: "fnirs_cw_amplitude"

  huang2021:
    subpath: "Huang2021/whole_data"
    description: "Huang2021 fNIRS dataset"
    original_data_type: "fnirs_fd_phase__fnirs_fd_ac_amplitude"
    tmax: 40

  gao2024:
    subpath: "Gao2024/data"
    description: "Gao2024 fNIRS dataset"
    original_data_type: "fnirs_cw_amplitude"
    tmax: 9

# Preprocessing configuration
preprocessing:
  skip_all: false # If true, skip all preprocessing steps entirely
  sci_threshold: 0.2 # Threshold for detecting bad channels (typical values range from 0.5 to 0.8)
  ch_interpolation: "interpolate_nearest" # Options: "interpolate_nearest", "drop", null
  tddr: true # Whether to apply TDDR motion correction
  l_freq: 0.01 # Low cut-off frequency for band-pass filter
  h_freq: 0.1 # High cut-off frequency for band-pass filter
  l_trans_bandwidth: 0.004 # Low transition bandwidth
  h_trans_bandwidth: 0.01 # High transition bandwidth
  filter_length: "auto" # Filter length
  filter_kwargs:
    method: "iir"
    iir_params:
      ftype: "butter"
      order: 3
  bll_ppf: 6 # Partial pathlength factor for HbO/HbR conversion
  remove_short: null # Remove channels with source-detector distance less than this value
  short_ch_regression: null # Maximum distance for short channel regression
  tmin: -2 # Time before event to include in epoch
  tmax: 15 # Time after event to include in epoch
  reject_criteria: null # Criteria for rejecting epochs (dict with channel types and PTP thresholds)
  allow_overlaps: false # Whether to allow overlapping epochs
  verbose: false

# Parser settings
parser:
  keep_stim_channel: false
  montage_type: "3d"

cv:
  cross:
    class: sklearn.model_selection.GroupKFold
    kwargs:
      n_splits: 5
      shuffle: true
      random_state: null
    inner:
      class: sklearn.model_selection.GroupKFold
      kwargs:
        n_splits: 4
  within:
    class: sklearn.model_selection.StratifiedKFold
    kwargs:
      n_splits: 5
      shuffle: true
      random_state: null
    inner:
      class: sklearn.model_selection.StratifiedKFold
      kwargs:
        n_splits: 4

paper:
  comparison_models:
    - lda
    # - logreg
    # - svm
    # - rf
    # - knn
    - ann
    - cnn2a
    - lstm
    - eegnet
    - dcn
    - aeon_multirockethydra
    - fnirst
    - fnirsnet23
    - fnirsnet24

task_selection:
  drop_if_present:
    shin2019__ma:
      - shin2019__mi__

# DataLoader settings
dataloader:
  cpu:
    num_workers: 0
    pin_memory: false
    persistent_workers: false
  gpu:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
