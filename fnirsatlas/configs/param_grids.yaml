lda:
  extractor__n_windows: [1, 3, 5, 15]
  extractor__features: [["mean"], ["slope"], ["std"], ["mean", "slope"]]

logreg:
  extractor__n_windows: [1, 5]
  clf__penalty: ["l1", "l2"]
  clf__C: [0.00001, 0.01, 1, 100]

svm:
  extractor__n_windows: [1, 5]
  clf__C: [0.0001, 0.001, 0.01, 0.1, 1, 10, 100, 1000]

rf:
  extractor__n_windows: [1, 5]
  clf__n_estimators: [10, 50, 100, 1000]
  clf__min_samples_leaf: [1, 2]

knn:
  extractor__n_windows: [1, 5]
  clf__n_neighbors: [1, 3, 5, 7]
  clf__weights: ["uniform", "distance"]

ann:
  extractor__n_windows: [1, 50]
  clf__activation: ["relu", "tanh"]
  clf__hidden_layer_sizes: [[20], [256]]
  clf__learning_rate_init: [0.001, 0.01]

eegnet:
  clf__lr: [0.01, 0.001]
  clf__p_dropout: [0.25, 0.5]
  clf__F1: [4, 16]
  clf__kernel_size_1: [3, 10]

dcn:
  clf__lr: [0.01, 0.001]
  clf__p_dropout: [0.25, 0.5]
  clf__D1: [4, 25]
  clf__kernel_size: [2, 10]

fnirsnet23:
  clf__lr: [0.01, 0.001]
  clf__F1: [2, 4, 8]
  clf__F2: [8, 16, 32]

fnirsnet24:
  clf__lr: [0.01, 0.001]
  clf__p_dropout: [0.25, 0.5]
  clf__temporal_filters: [4, 20]
  clf__spatial_filters: [4, 60]

cnn2a:
  clf__lr: [0.01, 0.001]
  clf__p_dropout: [0.25, 0.5]
  clf__n_filters: [16, 32]
  clf__kernel_size: [3, 10]

fnirst:
  clf__lr: [0.01, 0.001]
  clf__dim: [64, 128]
  clf__depth: [2, 6]
  clf__dropout: [0., 0.3]

lstm:
  clf__lr: [0.01, 0.001]
  clf__hidden_size: [32, 64]
  clf__num_layers: [2, 4]
  clf__p_dropout: [0.25, 0.5]

aeon_multirockethydra:
  clf__n_kernels: [2, 4, 8, 32]
  clf__n_groups: [8, 16, 64, 128]
