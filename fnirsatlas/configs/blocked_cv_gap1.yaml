# Blocked CV overlay: contiguous within-subject test folds.
# Used by scripts/checks/blocked_cv.py.
cv:
  within:
    class: fnirsatlas.model_selection.BlockedKFold
    kwargs:
      n_splits: 5
      shuffle: false
      random_state: null
      gap: 1
      min_test_size: 1
      class_balance_warning_threshold: 0.2
      past_only: false
