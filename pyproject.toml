[project]
name = "fnirsatlas"
dynamic = ["version"]
description = "fNIRS extensions for MOABB"
authors = [
    { name = "Kalle Mäkelä" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/kalomak/fNIRSAtlas"

[project.optional-dependencies]
aeon = [
    "aeon",
]
data = [
    "filelock",
    "mne>=1.13.2",
    "moabb>=1.7.2",
]
braindecode = [
    "braindecode",
]
dl = [
    "einops",
    "torch",
]
workflow = [
    "snakemake",
]
docs = [
    "myst-parser>=4.0.1",
    "pydata-sphinx-theme>=0.16.1",
    "Sphinx>=8.1.3",
    "sphinx-gallery>=0.19.0",
]

[tool.uv.sources]
mne = { git = "https://github.com/mne-tools/mne-python", branch = "main" }
# develop for moabb.analysis.plotting.plot_critical_difference, unreleased in 1.7.2.
moabb = { git = "https://github.com/NeuroTechX/moabb", branch = "develop" }

[tool.pytest.ini_options]
addopts = "-m 'not manual and not data'"
markers = [
    "data: tests requiring real dataset files",
    "manual: tests run only when selected with -m manual",
]

[tool.ty]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
    "ty",
]

[tool.hatch.version]
path = "fnirsatlas/__init__.py"
